stages:

  - name: Setup Clip Price
    exit:
      stat: clip_price
      operator: "<="
      value: 0.03
    rules:
      - name: lower_price
        condition:
          stat: clip_price
          operator: ">"
          value: 0.03
        action:
          type: click
          button: lower_clip_price

  - name: Enable Quantum Computing
    exit:
      stat: qchip_active
      operator: "!="
      value: 0
    tick:
      type: rapid_click
      button: make_paperclip
      clicks: 500
    rules:
      - name: wirebuyer_stage1
        condition:
          all:
            - stat: wire
              operator: "<"
              value: 100
            - stat: clips
              operator: "<"
              value: 450000
            - button: buy_wire
              state: enabled
        action:
          type: click
          button: buy_wire

      - name: add_processors_to_5
        condition:
          all:
            - stat: processors
              operator: "<"
              value: 5
            - button: add_processors
              state: enabled
        action:
          type: click
          button: add_processors

      - name: add_memory_to_10
        condition:
          all:
            - stat: processors
              operator: ">="
              value: 5
            - stat: memory
              operator: "<"
              value: 10
            - button: add_memory
              state: enabled
        action:
          type: click
          button: add_memory

      - name: raise_price_high_demand
        condition:
          all:
            - stat: clips
              operator: "<"
              value: 450000
            - stat: demand
              operator: ">"
              value: 1000
        action:
          type: click
          button: raise_clip_price

      - name: raise_price_prep_next_stage
        condition:
          all:
            - stat: clips
              operator: ">="
              value: 450000
            - stat: clip_price
              operator: "<"
              value: 0.20
        action:
          type: click
          button: raise_clip_price

      - name: bump_up_marketing_to_5
        condition:
          all:
            - stat: clips
              operator: ">="
              value: 450000
            - stat: marketing_level
              operator: "<"
              value: 5
            - button: marketing
              state: enabled
        action:
          type: click
          button: marketing

      - name: wirebuyer_stage2
        condition:
          all:
            - stat: clips
              operator: ">="
              value: 450000
            - stat: unsold_clips
              operator: "<"
              value: 10000
            - stat: wire
              operator: "<"
              value: 100
            - button: buy_wire
              state: enabled
        action:
          type: click
          button: buy_wire
    projects:
      - 3
      - 6
      - 12
      - 13
      - 14
      - 34
      - 50
      - 51

